<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receptionist Dashboard | Dr. P. N. Singh Clinic</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding: 0; }
  .login-box { max-width: 400px; margin: 90px auto; background: #fff; padding: 32px 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
  .login-box h2 { margin: 0 0 8px; }
  .login-box p { color: #64748b; font-size: 0.9rem; margin-bottom: 22px; }
  .login-input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; margin-bottom: 16px; }
  .login-btn { width: 100%; padding: 13px; background: #1e3a8a; color: #fff; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; }
  .admin-header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .admin-header h2 { margin: 0; font-size: 1.1rem; }
  .btn-outline { background: #fff; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
  .admin-container { max-width: 900px; margin: 20px auto; padding: 0 16px 40px; }
  .status-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .tab-btn { background: #fff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; font-weight: 600; color: #64748b; cursor: pointer; text-align: left; font-size: 0.88rem; }
  .tab-btn.active { border-color: #0f766e; color: #0f766e; background: #f0fdf4; }
  .search-bar { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .search-bar input { border: none; outline: none; width: 100%; font-size: 0.95rem; }
  .date-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .date-row input[type="date"] { padding: 8px 12px; border: 1px solid #0f172a; border-radius: 8px; font-size: 0.95rem; background: #fff; }
  .btn-small { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  .btn-small.active { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
  .count-text { color: #64748b; font-size: 0.9rem; margin-bottom: 16px; font-weight: 600; }
  .appt-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .appt-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
  .appt-row:last-child { border-bottom: none; }
  .appt-label { color: #94a3b8; font-weight: 600; font-size: 0.75rem; }
  .appt-val { font-weight: 600; color: #0f172a; text-align: right; }
  .appt-id { color: #0f766e; font-weight: 700; font-family: monospace; font-size: 0.95rem; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
  .badge.mode { background: #ecfdf5; color: #047857; }
  .badge.new { background: #fef3c7; color: #b45309; }
  .badge.accepted { background: #d1fae5; color: #065f46; }
  .badge.completed { background: #e0e7ff; color: #3730a3; }
  .badge.cancelled { background: #fee2e2; color: #991b1b; }
  .open-btn { background: #fff; border: 1px solid #cbd5e1; padding: 6px 16px; border-radius: 8px; font-weight: 600; color: #0f766e; cursor: pointer; }
  .action-drawer { display: none; margin-top: 12px; background: #f8fafc; padding: 14px; border-radius: 10px; border: 1px dashed #cbd5e1; }
  .action-drawer.show { display: block; }
  .drawer-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .btn-act { padding: 9px 14px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; color: #fff; }
  .btn-accept { background: #059669; }
  .btn-cancel { background: #dc2626; }
  .btn-complete { background: #2563eb; }
  .pay-box { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #e2e8f0; }
  .pay-box input, .pay-box select { padding: 7px; border: 1px solid #cbd5e1; border-radius: 6px; }

  /* WhatsApp Action Series (2 buttons per tab) */
  .wa-series-box { margin-top: 14px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
  .wa-series-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .wa-series-title { font-size: 0.8rem; font-weight: 700; color: #334155; text-transform: uppercase; letter-spacing: 0.4px; }
  .wa-reset-btn { background: none; border: none; color: #94a3b8; font-size: 0.75rem; cursor: pointer; text-decoration: underline; }
  .wa-series-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .wa-btn { padding: 10px 8px; border-radius: 8px; border: 1px solid transparent; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .wa-btn small { font-size: 0.7rem; font-weight: 500; opacity: 0.9; }
  .wa-btn.active-step { background: #0f172a; color: #ffffff; border-color: #0f172a; box-shadow: 0 4px 10px rgba(15, 23, 42, 0.2); }
  .wa-btn.active-step:hover { background: #1e293b; }
  .wa-btn.done-step { background: #ecfdf5; color: #059669; border-color: #a7f3d0; opacity: 0.72; }
  .wa-btn.pending-step { background: #f1f5f9; color: #94a3b8; border-color: #e2e8f0; }
  .due-pill { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; background: #fef3c7; color: #b45309; }
</style>
</head>
<body>

<div id="loginView" class="login-box">
  <h2>Admin Login</h2>
  <p>Enter your admin key to access receptionist dashboard.</p>
  <input type="password" id="adminKeyInput" class="login-input" placeholder="Enter Admin Key">
  <button type="button" id="loginBtn" class="login-btn" onclick="doLogin()">Login</button>
  <p id="loginError" style="color: #dc2626; font-size: 0.9rem; margin-top: 14px; font-weight: 600;"></p>
</div>

<div id="dashboardView" style="display: none;">
  <header class="admin-header">
    <h2>Reception Desk</h2>
    <div>
      <button type="button" onclick="fetchAppointments()" class="btn-outline">Refresh</button>
      <button type="button" onclick="doLogout()" class="btn-outline" style="color: #dc2626;">Logout</button>
    </div>
  </header>

  <div class="admin-container">
    <div class="status-tabs">
      <button type="button" id="tabActive" class="tab-btn active" onclick="setTab('all')">All statuses</button>
      <button type="button" id="tabFollowup" class="tab-btn" onclick="setTab('followup')">Care & Follow-up</button>
      <button type="button" id="tabFinished" class="tab-btn" onclick="setTab('finished')">Finished visits</button>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search patient name or phone" oninput="renderList()">
    </div>

    <div class="date-row">
      <label for="dateFilter"><b>Date:</b></label>
      <input type="date" id="dateFilter" onchange="onDatePick()">
      <button type="button" id="btnAllDates" class="btn-small active" onclick="clearDate()">All Upcoming</button>
      <button type="button" id="btnToday" class="btn-small" onclick="pickToday()">Today</button>
    </div>

    <div class="count-text" id="totalCount">0 appointments</div>
    <div id="appointmentsList"></div>
  </div>
</div>

<script>
// ==========================================
// GOOGLE CONSENT FORM CONFIG (PRE-FILLED LINK)
// ==========================================
var GOOGLE_FORM_CONFIG = {
  baseUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSfA2NWLgU9OLd5hFxOBVfxYYFeImTSGfpbNiutKLapA5M1KfA/viewform',
  entryName: 'entry.821763214',
  entryPhone: 'entry.108867732',
  entryApptId: '',
  entryPatientNo: 'entry.485623932'
};

var savedKey = localStorage.getItem('drpn_admin_key') || '';
var allItems = [];
var activeTab = 'all';
var openDrawers = {};

window.onload = function() {
  var inp = document.getElementById('adminKeyInput');
  if (inp) {
    inp.addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        doLogin();
      }
    });
  }
  if (savedKey) {
    checkAndLoad(savedKey, true);
  }
};

function getStepStore() {
  try {
    return JSON.parse(localStorage.getItem('drpn_wa_steps') || '{}');
  } catch (e) {
    return {};
  }
}

function saveStepStore(store) {
  try {
    localStorage.setItem('drpn_wa_steps', JSON.stringify(store));
  } catch (e) {}
}

function getApptSteps(id) {
  var store = getStepStore();
  return store[id] || { consent: false, reminder: false, care: false, followup: false };
}

function markApptStepDone(id, stepKey) {
  var store = getStepStore();
  if (!store[id]) store[id] = { consent: false, reminder: false, care: false, followup: false };
  store[id][stepKey] = true;
  saveStepStore(store);
}

function resetWaSteps(id) {
  if (!confirm('Reset WhatsApp button progress for this patient?')) return;
  var store = getStepStore();
  if (store[id]) {
    if (activeTab === 'followup') {
      store[id].care = false;
      store[id].followup = false;
    } else {
      store[id].consent = false;
      store[id].reminder = false;
    }
    saveStepStore(store);
  }
  renderList();
}

function formatWaPhone(raw) {
  var digits = String(raw || '').replace(/\D/g, '');
  if (digits.length === 10) return '91' + digits;
  return digits;
}

function buildConsentFormUrl(a) {
  if (!GOOGLE_FORM_CONFIG.baseUrl) return '[INSERT_GOOGLE_FORM_LINK_HERE]';
  var params = ['usp=pp_url'];
  if (GOOGLE_FORM_CONFIG.entryName && a.name) params.push(GOOGLE_FORM_CONFIG.entryName + '=' + encodeURIComponent(a.name));
  if (GOOGLE_FORM_CONFIG.entryPhone && a.phone) params.push(GOOGLE_FORM_CONFIG.entryPhone + '=' + encodeURIComponent(a.phone));
  if (GOOGLE_FORM_CONFIG.entryApptId && a.appointmentNumber) params.push(GOOGLE_FORM_CONFIG.entryApptId + '=' + encodeURIComponent(a.appointmentNumber));
  if (GOOGLE_FORM_CONFIG.entryPatientNo && a.patientNumber) params.push(GOOGLE_FORM_CONFIG.entryPatientNo + '=' + encodeURIComponent(a.patientNumber));
  return GOOGLE_FORM_CONFIG.baseUrl + '?' + params.join('&');
}

function sendWaStep(id, stepKey) {
  var a = null;
  for (var i = 0; i < allItems.length; i++) {
    if (allItems[i].id === id) { a = allItems[i]; break; }
  }
  if (!a) return;

  var phone = formatWaPhone(a.phone);
  if (!phone) {
    alert('Valid phone number not found.');
    return;
  }

  var msg = '';
  var pName = a.name || 'Patient';
  var pDate = niceDate(a.date);
  var pTime = a.time || '';

  if (stepKey === 'consent') {
    var formUrl = buildConsentFormUrl(a);
    msg = 'Namaste ' + pName + ' ji,\n\n'
        + 'Dr. P. N. Singh ke saath aapke consultation se pehle, kripya yeh chhota sa Pre-Consultation Consent Form bhar dein:\n'
        + formUrl + '\n\n'
        + '• Appointment ID: #' + (a.appointmentNumber || '-') + '\n'
        + '• Patient No.: ' + (a.patientNumber ? '#' + a.patientNumber : 'Assigned') + '\n\n'
        + 'Form bharne ke baad humein yahan inform kar dein. Dhanyavaad!\n'
        + '— Dr. P. N. Singh Clinic';
  } else if (stepKey === 'reminder') {
    msg = 'Namaste ' + pName + ' ji,\n\n'
        + '⏰ *Appointment Reminder:* Dr. P. N. Singh ke saath aapka consultation *15 minute* mein shuru hone wala hai.\n\n'
        + '• Date: ' + pDate + '\n'
        + '• Time: ' + pTime + '\n'
        + '• Mode: ' + (a.mode || 'Consultation') + '\n\n'
        + 'Kripya shant jagah par aur achhe internet connection ke saath taiyaar rahein.\n'
        + '— Dr. P. N. Singh Clinic';
  } else if (stepKey === 'care') {
    msg = 'Namaste ' + pName + ' ji,\n\n'
        + 'Hum ummeed karte hain ki aap pehle se behtar mehsoos kar rahe honge. 😊\n\n'
        + 'Kya aapko Dr. P. N. Singh dwara di gayi medicines suit kar rahi hain ya koi pareshani mehsoos ho rahi hai? Kripya humein zaroor batayein — hum aapki madad ke liye yahan hain.\n'
        + '— Dr. P. N. Singh Clinic';
  } else if (stepKey === 'followup') {
    msg = 'Namaste ' + pName + ' ji,\n\n'
        + '📅 *Follow-up Reminder:* Aapki medicines ka course jald poora hone wala hai. Bina ruke behtar ilaaj ke liye kripya apna follow-up / recheckup appointment book kar lein.\n\n'
        + 'Booking ke liye aap yahan reply kar sakte hain ya hamari website par book kar sakte hain.\n'
        + '— Dr. P. N. Singh Clinic';
  }

  var waUrl = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
  window.open(waUrl, '_blank', 'noopener');

  markApptStepDone(id, stepKey);
  openDrawers[id] = true;
  renderList();
}

function getDaysSince(dateStr) {
  if (!dateStr) return 0;
  var todayStr = getTodayIso();
  var d1 = new Date(dateStr + 'T00:00:00');
  var d2 = new Date(todayStr + 'T00:00:00');
  return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
}

function doLogin() {
  var val = document.getElementById('adminKeyInput').value.trim();
  var err = document.getElementById('loginError');
  if (!val) {
    err.textContent = 'Please enter Admin Key.';
    return;
  }
  checkAndLoad(val, false);
}

async function checkAndLoad(key, isAuto) {
  var btn = document.getElementById('loginBtn');
  var err = document.getElementById('loginError');
  btn.disabled = true;
  btn.textContent = 'Checking...';
  err.textContent = '';

  try {
    var res = await fetch('/api/admin/appointments', {
      method: 'GET',
      headers: { 'x-admin-key': key }
    });

    if (res.status === 401) {
      localStorage.removeItem('drpn_admin_key');
      savedKey = '';
      if (!isAuto) {
        err.textContent = 'Wrong Admin Key! Please check your key.';
      }
      document.getElementById('loginView').style.display = 'block';
      document.getElementById('dashboardView').style.display = 'none';
      btn.disabled = false;
      btn.textContent = 'Login';
      return;
    }

    var data = await res.json();
    if (res.ok && data.ok) {
      savedKey = key;
      localStorage.setItem('drpn_admin_key', key);
      allItems = data.appointments || [];
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
      renderList();
    } else {
      err.textContent = data.message || 'Server error.';
    }
  } catch (e) {
    err.textContent = 'Connection error: ' + e.message;
  }
  btn.disabled = false;
  btn.textContent = 'Login';
}

function doLogout() {
  localStorage.removeItem('drpn_admin_key');
  savedKey = '';
  document.getElementById('adminKeyInput').value = '';
  document.getElementById('dashboardView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}

async function fetchAppointments() {
  var box = document.getElementById('appointmentsList');
  box.innerHTML = '<p style="text-align:center;">Loading...</p>';
  try {
    var res = await fetch('/api/admin/appointments', {
      headers: { 'x-admin-key': savedKey }
    });
    if (res.status === 401) {
      doLogout();
      return;
    }
    var data = await res.json();
    if (data.ok) {
      allItems = data.appointments || [];
      renderList();
    }
  } catch (e) {
    box.innerHTML = '<p style="text-align:center;color:red;">Error loading list.</p>';
  }
}

function setTab(t) {
  activeTab = t;
  document.getElementById('tabActive').className = (t === 'all') ? 'tab-btn active' : 'tab-btn';
  document.getElementById('tabFollowup').className = (t === 'followup') ? 'tab-btn active' : 'tab-btn';
  document.getElementById('tabFinished').className = (t === 'finished') ? 'tab-btn active' : 'tab-btn';
  renderList();
}

function getTodayIso() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
}

function onDatePick() {
  var d = document.getElementById('dateFilter').value;
  document.getElementById('btnAllDates').className = (!d) ? 'btn-small active' : 'btn-small';
  document.getElementById('btnToday').className = (d === getTodayIso()) ? 'btn-small active' : 'btn-small';
  renderList();
}

function clearDate() {
  document.getElementById('dateFilter').value = '';
  onDatePick();
}

function pickToday() {
  document.getElementById('dateFilter').value = getTodayIso();
  onDatePick();
}

function niceDate(str) {
  if (!str) return '-';
  var p = str.split('-');
  if (p.length !== 3) return str;
  var dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderWaButtonsHtml(a) {
  var steps = getApptSteps(a.id);
  var visibleSteps = (activeTab === 'followup')
    ? [
        { key: 'care',     label: '1. Care Message', sub: 'After 7 Days' },
        { key: 'followup', label: '2. Follow-up',    sub: 'Recheckup' }
      ]
    : [
        { key: 'consent',  label: '1. Consent Form',    sub: 'Google Form' },
        { key: 'reminder', label: '2. 15-Min Reminder', sub: 'Before Call' }
      ];

  var activeKey = null;
  for (var s = 0; s < visibleSteps.length; s++) {
    if (!steps[visibleSteps[s].key]) {
      activeKey = visibleSteps[s].key;
      break;
    }
  }

  var daysSince = getDaysSince(a.date);
  var dueBadge = '';
  if (activeTab === 'followup') {
    if (daysSince >= 7 && !steps.care) {
      dueBadge = '<span class="due-pill">Care Due (' + daysSince + 'd)</span>';
    } else if (daysSince >= 12 && !steps.followup) {
      dueBadge = '<span class="due-pill">Follow-up Due</span>';
    }
  }

  var boxTitle = (activeTab === 'followup') ? 'Care & Follow-up' : 'WhatsApp Actions';

  var html = '<div class="wa-series-box">';
  html += '<div class="wa-series-head">';
  html += '<span class="wa-series-title"><i class="fa-brands fa-whatsapp" style="color:#16a34a;"></i> ' + boxTitle + ' ' + dueBadge + '</span>';
  html += '<button type="button" class="wa-reset-btn" onclick="resetWaSteps(\'' + a.id + '\')">Reset</button>';
  html += '</div>';
  html += '<div class="wa-series-grid">';

  for (var j = 0; j < visibleSteps.length; j++) {
    var stObj = visibleSteps[j];
    var isDone = !!steps[stObj.key];
    var cls = 'pending-step';
    var prefix = '';

    if (isDone) {
      cls = 'done-step';
      prefix = '✓ ';
    } else if (stObj.key === activeKey) {
      cls = 'active-step';
    }

    html += '<button type="button" class="wa-btn ' + cls + '" onclick="sendWaStep(\'' + a.id + '\', \'' + stObj.key + '\')">';
    html += '<span>' + prefix + stObj.label + '</span>';
    html += '<small>' + (isDone ? 'Sent (Tap to resend)' : stObj.sub) + '</small>';
    html += '</button>';
  }

  html += '</div></div>';
  return html;
}

function renderList() {
  var selDate = document.getElementById('dateFilter').value;
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var box = document.getElementById('appointmentsList');

  var list = allItems.filter(function(item) {
    if (activeTab === 'finished') {
      if (item.status !== 'completed' && item.status !== 'cancelled') return false;
    } else if (activeTab === 'followup') {
      if (item.status !== 'accepted' && item.status !== 'completed') return false;
      var steps = getApptSteps(item.id);
      if (steps.care && steps.followup) return false;
    }
    if (selDate && item.date !== selDate) return false;
    if (q) {
      var nm = (item.name || '').toLowerCase();
      var ph = (item.phone || '').toLowerCase();
      var id = (item.appointmentNumber || '').toLowerCase();
      if (nm.indexOf(q) === -1 && ph.indexOf(q) === -1 && id.indexOf(q) === -1) return false;
    }
    return true;
  });

  document.getElementById('totalCount').textContent = list.length + ' appointments';

  if (list.length === 0) {
    box.innerHTML = '<div style="background:#fff;padding:30px;border-radius:12px;text-align:center;color:#64748b;">No appointments found.</div>';
    return;
  }

  var out = '';
  for (var i = 0; i < list.length; i++) {
    var a = list[i];
    var st = a.status || 'new';
    var isPaid = a.payment && a.payment.status === 'paid';
    var payTxt = isPaid ? ('Paid Rs.' + a.payment.amount + ' (' + a.payment.method + ')') : 'Unpaid';
    var drawerClass = openDrawers[a.id] ? 'action-drawer show' : 'action-drawer';

    out += '<div class="appt-card">';
    out += '<div class="appt-row"><span class="appt-label">APPOINTMENT ID</span><span class="appt-id">' + esc(a.appointmentNumber || '-') + '</span></div>';
    out += '<div class="appt-row"><span class="appt-label">PATIENT NO.</span><span class="appt-val">' + esc(a.patientNumber || '-') + '</span></div>';
    out += '<div class="appt-row"><span class="appt-label">PATIENT NAME</span><span class="appt-val">' + esc(a.name || '-') + '</span></div>';
    out += '<div class="appt-row"><span class="appt-label">PHONE</span><span class="appt-val">' + esc(a.phone || '-') + '</span></div>';
    out += '<div class="appt-row"><span class="appt-label">DATE & TIME</span><span class="appt-val">' + niceDate(a.date) + ' ' + esc(a.time || '') + '</span></div>';
    out += '<div class="appt-row"><span class="appt-label">MODE</span><span class="appt-val"><span class="badge mode">' + esc(a.mode || 'Clinic') + '</span></span></div>';
    out += '<div class="appt-row"><span class="appt-label">STATUS</span><span class="appt-val"><span class="badge ' + esc(st) + '">' + esc(st.toUpperCase()) + '</span></span></div>';
    out += '<div class="appt-row"><span class="appt-label">EMAIL</span><span class="appt-val">' + esc(a.email || '-') + '</span></div>';
    out += '<div class="appt-row"><span class="appt-label">ACTION</span><span class="appt-val"><button type="button" class="open-btn" onclick="toggleBox(\'' + a.id + '\')">' + (openDrawers[a.id] ? 'Close' : 'Open') + '</button></span></div>';

    out += '<div id="box_' + a.id + '" class="' + drawerClass + '">';
    out += '<div style="font-size:0.85rem;margin-bottom:8px;"><b>Concern:</b> ' + esc(a.concern || 'None') + ' | <b>Payment:</b> ' + esc(payTxt) + '</div>';
    out += '<div class="drawer-btns">';
    if (st === 'new') {
      out += '<button type="button" class="btn-act btn-accept" onclick="changeStatus(\'' + a.id + '\', \'accepted\')">Accept & Assign Token</button>';
      out += '<button type="button" class="btn-act btn-cancel" onclick="changeStatus(\'' + a.id + '\', \'cancelled\')">Cancel</button>';
    } else if (st === 'accepted') {
      out += '<button type="button" class="btn-act btn-complete" onclick="changeStatus(\'' + a.id + '\', \'completed\')">Mark Completed</button>';
      out += '<button type="button" class="btn-act btn-cancel" onclick="changeStatus(\'' + a.id + '\', \'cancelled\')">Cancel</button>';
    }
    out += '</div>';

    if (st === 'accepted' && !isPaid) {
      out += '<div class="pay-box">';
      out += '<input type="number" id="amt_' + a.id + '" value="400" style="width:80px;">';
      out += '<select id="mtd_' + a.id + '"><option value="cash">Cash</option><option value="upi">UPI</option></select>';
      out += '<button type="button" class="btn-act" style="background:#0f766e;" onclick="savePay(\'' + a.id + '\')">Mark Paid</button>';
      out += '</div>';
    }

    if (st === 'accepted' || st === 'completed') {
      out += renderWaButtonsHtml(a);
    }

    out += '</div></div>';
  }
  box.innerHTML = out;
}

function toggleBox(id) {
  openDrawers[id] = !openDrawers[id];
  renderList();
}

async function changeStatus(id, st) {
  try {
    var res = await fetch('/api/admin/appointments/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': savedKey },
      body: JSON.stringify({ status: st })
    });
    var d = await res.json();
    if (res.ok && d.ok) {
      openDrawers[id] = true;
      fetchAppointments();
    } else {
      alert(d.message || 'Error updating status');
    }
  } catch (e) {
    alert('Network error');
  }
}

async function savePay(id) {
  var amt = Number(document.getElementById('amt_' + id).value);
  var mtd = document.getElementById('mtd_' + id).value;
  try {
    var res = await fetch('/api/admin/appointments/' + id + '/payment', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': savedKey },
      body: JSON.stringify({ amount: amt, method: mtd })
    });
    var d = await res.json();
    if (res.ok && d.ok) {
      openDrawers[id] = true;
      fetchAppointments();
    } else {
      alert(d.message || 'Error saving payment');
    }
  } catch (e) {
    alert('Network error');
  }
}
</script>
</body>
</html>
